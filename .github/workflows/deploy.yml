name: Deploy to production

# Deploying is one action on one host: pull all three repos, rebuild, verify.
# The logic lives in yumi-nexus/deploy/deploy.sh — this workflow only reaches
# the host and runs it, so how a deploy works is defined in one place.
#
# Gated on CI rather than on push. This repository has a test suite, and
# shipping a commit that failed it is worse than shipping late.
#
# Not a reusable workflow called from yumi-nexus: that repo is private, so
# cross-repository reuse would need access grants for no gain over thirty
# duplicated lines. No secret is shared either way — the Workload Identity
# provider already accepts this repository by name, and only from main.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: yumi-nexus-1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only a green CI run on main deploys. workflow_run fires for failures and
    # for other branches too, so the condition is doing real work.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: yumi-nexus
          workload_identity_provider: projects/422780862425/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@yumi-nexus.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud compute ssh yumi-nexus-1 \
            --zone=australia-southeast1-a \
            --project=yumi-nexus \
            --tunnel-through-iap \
            --quiet \
            --command="set -e
              sudo -u admin_ git -C /home/admin_/Yumi/yumi-nexus fetch --quiet origin main
              sudo -u admin_ git -C /home/admin_/Yumi/yumi-nexus merge --ff-only origin/main --quiet
              sudo chmod +x /home/admin_/Yumi/yumi-nexus/deploy/deploy.sh
              sudo /home/admin_/Yumi/yumi-nexus/deploy/deploy.sh"

      - name: Verify from the public internet
        run: |
          for i in $(seq 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://api.yumi.nexus/health || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "api.yumi.nexus did not return 200 after the deploy"
          exit 1
